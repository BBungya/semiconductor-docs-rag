[project]
name = "semiconductor-docs-rag"
version = "0.1.0"
description = "반도체 공개 기술 문서 기반 한국어 RAG 프로젝트"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semiconductor_rag"]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100